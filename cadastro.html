<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        (function () {
            try { document.documentElement.setAttribute('data-theme', localStorage.getItem('site-theme') || 'light'); } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Notícias Hoje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/7c95230d43.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="text-gray-800 antialiased flex flex-col min-h-screen" style="font-family:'Inter',sans-serif">
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4">
            <a href="index.html" title="Página Inicial"><img src="img/logo 01.gif" alt="Logotipo do Site" class="h-16 w-auto rounded"></a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-10 w-full flex justify-center">
        <section class="w-full max-w-md bg-white rounded-2xl shadow-md border border-gray-100 p-8 self-start">
            <h1 class="text-2xl font-extrabold text-gray-900 mb-1">Criar conta</h1>
            <p class="text-sm text-gray-600 mb-6">Cadastre-se para acessar o portal.</p>
            <div id="msg" role="alert" hidden></div>
            <form id="form-cadastro" class="space-y-4" novalidate>
                <div>
                    <label for="nome" class="block text-sm font-semibold text-gray-700 mb-1">Nome completo</label>
                    <input id="nome" name="nome" type="text" autocomplete="name" required
                           class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                           class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1">Senha (mín. 8 caracteres, com letras e números)</label>
                    <div class="relative">
                        <input id="senha" name="senha" type="password" autocomplete="new-password" required
                               class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 pr-10 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                        <button type="button" data-toggle-senha="senha" aria-label="Mostrar senha"
                                class="absolute inset-y-0 right-0 px-3 text-gray-500 hover:text-blue-600"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <div>
                    <label for="confirma" class="block text-sm font-semibold text-gray-700 mb-1">Confirmar senha</label>
                    <div class="relative">
                        <input id="confirma" name="confirma" type="password" autocomplete="new-password" required
                               class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 pr-10 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                        <button type="button" data-toggle-senha="confirma" aria-label="Mostrar senha"
                                class="absolute inset-y-0 right-0 px-3 text-gray-500 hover:text-blue-600"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-md font-semibold transition-colors shadow-md">Criar conta</button>
            </form>
            <p class="text-sm text-gray-600 mt-6 text-center">Já tem conta? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Entrar</a></p>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-500 py-6 border-t-4 border-blue-600 text-center text-sm">
        &copy; 2026 Portal de Notícias Hoje. Todos os direitos reservados.
    </footer>
    <script src="js/theme.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
